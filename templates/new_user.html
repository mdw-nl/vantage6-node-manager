{% extends "base.html" %}

{% block title %}Add User - Vantage6 Node Manager{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title">
        <i class="bi bi-person-plus"></i> Add User
    </h1>
    <a href="{{ url_for('auth.list_users') }}" class="btn btn-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Back
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-person-plus"></i> New user
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus
                               pattern="[a-zA-Z0-9_-]+" placeholder="jdoe">
                        <div class="form-text">Letters, numbers, underscore and hyphen only.</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="8">
                        <div class="form-text">At least 8 characters.</div>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">Role</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="viewer" selected>Viewer &mdash; can observe nodes, no actions</option>
                            <option value="admin">Admin &mdash; full access</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Create user</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
